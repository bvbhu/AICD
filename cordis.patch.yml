# dsh-pixmax-workflow — bundle composition.
#
# The only row here IS the bundle itself: its `name` is exactly the package
# name, which is the only row dsh-client-modules mounts the browser half
# (settings card) onto. It registers the HTTP bridge and no tools. It is NOT a
# switchable component — turning it off removes the settings page and the bridge.
#
# Tools are NOT declared at bundle level on purpose. A root-level row would be
# visible to every preset (e.g. `standard`); the tools must only reach the
# bundled preset. They live in presets/ai-video-workflow.patch.yml instead:
#   image-tools / video-tools / pixmax-tools
# To get them in another preset, add the rows to that preset yourself — they are
# deliberately not inherited.
#
# A `config:` key with only comments parses as YAML null, so every row declares
# an explicit mapping.
- insert:
    - id: pixmax-workflow
      name: 'dsh-pixmax-workflow'
