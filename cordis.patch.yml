# Root-level tool rows: disabled by default so other presets do NOT get them by
# accident. Turn one on (DSH Settings → Plugins, or flip `disabled`) to expose it
# to presets that do not declare the row themselves. The AI 视频工作流 preset
# below carries its own enabled copies.
- insert:
    - id: gpt-tools
      name: 'dsh-shotflow'
      disabled: true
    - id: video-tools
      name: 'dsh-shotflow/video'
      disabled: true
      config:
        backend: auto
        # ffmpegPath: 'D:/path/to/ffmpeg.exe'
    - id: pixmax-tools
      name: 'dsh-shotflow/pixmax'
      disabled: true
      config:
        # pixmaxHome: '~/.pixmax-cli'
        # environment: cn
    # Settings page for the 生图模型列表 (host JSON bridge + browser card).
    # Enabled by default: it registers no tools and spends nothing — it only
    # reads/writes <root>/settings.json and the DSH credential center.
    - id: shotflow-settings
      name: 'dsh-shotflow/settings'

# AI video generation workflow preset: tools only. No persona and no extra
# context files — just the ChatGPT web tools and the local ffmpeg video analysis
# tools, so the agent prompt stays clean.
- insert:
    - id: preset-ai-video-workflow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ai-video-workflow
        name: AI 视频工作流
        description: 'AI 视频生成工作流工具集：ChatGPT 网页对话/生图 + ffmpeg 视频解析（探测、截帧、切点、总览图）。'
        order: 20
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Image-model settings page: model list + API keys (no tools)
          - id: shotflow-settings
            name: 'dsh-shotflow/settings'
          # ChatGPT web tools: gpt_ask / gpt_image / gpt_last / image_model_list
          - id: gpt-tools
            name: 'dsh-shotflow'
            config:
              bridgeUrl: 'http://127.0.0.1:9777'
              token: 'dsh-local'
              reuseExistingTab: true
          # Local video tools: video_probe / video_frames / video_scenes / video_sheet
          - id: video-tools
            name: 'dsh-shotflow/video'
            config:
              bridgeUrl: 'http://127.0.0.1:9777'
              token: 'dsh-local'
              backend: auto
              # ffmpegPath: 'D:/path/to/ffmpeg.exe'
          # Read-only Pixmax inspection (never spends credits or mutates a canvas)
          - id: pixmax-tools
            name: 'dsh-shotflow/pixmax'
            config:
              # pixmaxHome: '~/.pixmax-cli'
              # environment: cn
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
